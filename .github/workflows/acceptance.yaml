name: Acceptance

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This archetype is a platform overlay: the suite is purely static (render + inspect), so no
      # Node/pnpm toolchain is needed - prova renders the archetype in-process and asserts on files.
      - uses: prova-rs/run-action@v1
        with:
          profile: ci
