[requires]
prova = ">= 0.16"

# Prova acceptance tests: `prova` from the repo root runs the whole suite.
[run]
proofs = ["tests"]
# Serial: every proof renders the archetype, and concurrent renders collide on archetect's shared
# git cache for the composed prompt/CI/manifest libraries.
jobs = 1

# CI runs the same suite. This archetype is a platform overlay — it generates no project, so there
# is nothing to build or boot and a runner needs no language toolchain (E7).
[profiles.ci]
jobs = 1
format = "json"

# `p6m` is the org standards suite (released v1; the ratchet: spec bumps move the v1 tag and the
# fleet answers). The overlay standards are E1–E7 in its docs/standards.md §2b.
[dependencies]
p6m = "p6m-archetypes/prova-p6m-standards@v1"
