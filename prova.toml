[requires]
prova = ">= 0.16"

# Prova acceptance tests: `prova` from the repo root runs the whole suite.
[run]
proofs = ["tests"]
# Serial: every proof renders the archetype, and concurrent renders collide on archetect's shared
# git cache for the composed prompt/CI/manifest libraries.
jobs = 1

# CI runs the same suite. This archetype is a platform overlay — it generates no project, so there
# is nothing to build or boot and a runner needs no language toolchain (E7).
[profiles.ci]
jobs = 1
format = "json"

# `p6m` is the org standards suite. The overlay standards are E1–E7 in its docs/standards.md §2b.
#
# NOTE (YP6M-3372): pinned to `dev`, the org's integration branch, while the studio staging is
# brought up against the whole archetype fleet — deliberate and temporary, so standards changes
# land here without waiting on a release. The suite's `p6m-pin` reminder is DUE for as long as
# this pin rides a branch (silent again on a released tag); heed it (`prova --heed=p6m-pin`, or a
# profile's `heed = ["p6m-pin"]`) when the window closes.
[dependencies]
p6m = { git = "https://github.com/p6m-archetypes/prova-p6m-standards", branch = "dev" }
