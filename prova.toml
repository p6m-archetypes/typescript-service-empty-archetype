# Prova acceptance tests: `prova` from the repo root runs the whole suite.
[run]
paths = ["tests"]
# Serial: concurrent renders collide on archetect's shared git cache for the composed libraries.
jobs = 1

# CI runs the same suite (this overlay has no build/live tier - it renders platform files only).
[profiles.ci]
paths = ["tests"]
jobs = 1
format = "json"
